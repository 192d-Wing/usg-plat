# NIST 800-53: SR-3, SA-12 (supply chain), CM-10 (software usage restrictions).
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Only licenses present in the dependency graph (CM-10). Add one here only
# after review when a new dependency needs it.
# ISC (FIPS TLS, POAM-004/005): aws-lc-rs, aws-lc-fips-sys, untrusted, rustls-webpki.
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "Unicode-3.0", "ISC"]
# OpenSSL licence is NOT allowed globally. Only the AWS-LC FIPS module carries it
# (crates.io: aws-lc-fips-sys "ISC AND (Apache-2.0 OR ISC) AND OpenSSL").
# aws-lc-sys >= 0.47 no longer declares OpenSSL, so it needs no exception;
# add one here only after review if a resolved version does.
# GPL-2.0-only is NOT allowed globally. Only the eBPF fast-path object carries it
# (user decision Option A, POAM-016): plat-xdp-ebpf is "MIT OR GPL-2.0-only" and
# its object declares "Dual MIT/GPL" because the kernel helper bpf_fib_lookup is
# gpl_only. Every other crate, including plat-xdp-core, plat-xdp and
# plat-xdp-loader, stays Apache-2.0 (license.workspace). SEC-007: the exception
# is pinned to the workspace crate's exact version (crates/plat-xdp-ebpf,
# publish = false). cargo-deny 0.20 package specs take a name and version but
# no source; a registry crate of the same name could only enter through a
# dependency, which [sources] (crates.io only) and review would show. cargo-deny
# accepts the crate's "MIT OR GPL-2.0-only" through MIT alone, so this exception
# records the decision rather than unblocking the check; it widens nothing for
# any other crate or version. A version bump of plat-xdp-ebpf must update the
# pin here (cargo-deny then warns "license exception was not encountered").
# Zlib is NOT allowed globally. Only foldhash carries it: the default hasher of
# hashbrown 0.17 ("default-hasher"), which aya 0.16.0 (plat-xdp, userspace XDP
# loader; Linux only) enables. Zlib is a permissive OSI licence with no
# copyleft; pinned to the exact version so a bump is reviewed again (CM-10,
# SR-3; WU3).
exceptions = [
    { crate = "aws-lc-fips-sys", allow = ["OpenSSL"] },
    { crate = "plat-xdp-ebpf@0.1.0", allow = ["GPL-2.0-only"] },
    { crate = "foldhash@0.2.0", allow = ["Zlib"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry a version and every crate is publish = false.
allow-wildcard-paths = true
# Crypto-dependency rule (T2 of the CBOM drift checks; T3 in
# deploy/tests/supply-chain/check-cbom.py is the catch-all for crates not
# named here). All C/FFI crypto stays behind plat-tls with the AWS-LC FIPS
# provider (CLAUDE.md); a second provider or a pure-Rust primitive crate is
# refused, and each allowed crypto crate may only be pulled in by the listed
# direct parents (`wrappers`). Changing this list changes
# docs/compliance/cbom.cdx.json in the same review.
# COMPLIANCE MAPPING:
# - NIST 800-53: SR-3 (Supply Chain Controls), CM-8 (System Component
#   Inventory), SC-13 (Cryptographic Protection)
deny = [
    { crate = "ring", reason = "no second crypto provider (CLAUDE.md)" },
    { crate = "openssl", reason = "no second crypto provider (CLAUDE.md)" },
    { crate = "openssl-sys", reason = "no second crypto provider (CLAUDE.md)" },
    { crate = "native-tls", reason = "no second crypto provider (CLAUDE.md)" },
    { crate = "boring", reason = "no second crypto provider (CLAUDE.md)" },
    { crate = "boring-sys", reason = "no second crypto provider (CLAUDE.md)" },
    { crate = "rustls-openssl", reason = "no second crypto provider (CLAUDE.md)" },
    { crate = "rustls-rustcrypto", reason = "no second crypto provider (CLAUDE.md)" },
    { crate = "rustls-post-quantum", reason = "no second crypto provider (CLAUDE.md)" },
    { crate = "rustls-symcrypt", reason = "no second crypto provider (CLAUDE.md)" },
    { crate = "rustls-graviola", reason = "no second crypto provider (CLAUDE.md)" },
    { crate = "p256", reason = "primitives come from the FIPS module only" },
    { crate = "p384", reason = "primitives come from the FIPS module only" },
    { crate = "ecdsa", reason = "primitives come from the FIPS module only" },
    { crate = "rsa", reason = "primitives come from the FIPS module only" },
    { crate = "ed25519-dalek", reason = "primitives come from the FIPS module only" },
    { crate = "x25519-dalek", reason = "primitives come from the FIPS module only" },
    { crate = "curve25519-dalek", reason = "primitives come from the FIPS module only" },
    { crate = "aes", reason = "primitives come from the FIPS module only" },
    { crate = "aes-gcm", reason = "primitives come from the FIPS module only" },
    { crate = "chacha20poly1305", reason = "primitives come from the FIPS module only" },
    { crate = "hmac", reason = "primitives come from the FIPS module only" },
    { crate = "sha1", reason = "primitives come from the FIPS module only" },
    { crate = "md-5", reason = "primitives come from the FIPS module only" },
    { crate = "blake3", reason = "primitives come from the FIPS module only" },
    { crate = "ml-kem", reason = "primitives come from the FIPS module only" },
    { crate = "ml-dsa", reason = "primitives come from the FIPS module only" },
    { crate = "pqcrypto", reason = "primitives come from the FIPS module only" },
    { crate = "pqcrypto-traits", reason = "primitives come from the FIPS module only" },
    # Allowed crypto crates, only through the listed direct parents.
    { crate = "aws-lc-rs", wrappers = ["plat-tls", "rustls", "rustls-webpki", "rcgen"], reason = "FIPS provider API behind plat-tls" },
    { crate = "aws-lc-fips-sys", wrappers = ["aws-lc-rs", "plat-tls"], reason = "the FIPS module (POAM-026)" },
    { crate = "aws-lc-sys", wrappers = ["aws-lc-rs"], reason = "linked, never installed as provider (NIST-006)" },
    { crate = "rustls", wrappers = ["plat-tls", "plat-audit", "platd"], reason = "TLS 1.3 behind the plat-tls policy" },
    { crate = "rustls-webpki", wrappers = ["rustls"], reason = "path validation via the FIPS provider" },
    { crate = "sha2", wrappers = ["plat-audit", "plat-cluster", "plat-xdp", "platd"], reason = "integrity digests listed in the CBOM" },
    { crate = "ahash", wrappers = ["plat-nat64"], reason = "keyed HashDoS hashing (SC-5), not SC-13" },
    { crate = "rcgen", wrappers = ["plat-tls", "plat-audit", "platd"], reason = "test PKI only (dev-dependency)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
