# usg-plat XDP fast path runtime paths. Install as
# /usr/lib/tmpfiles.d/plat-xdp.conf. plat-xdp.service applies it
# (ExecStartPre=+systemd-tmpfiles --create) after run-plat-bpf.mount, and
# systemd-tmpfiles-setup.service applies it at boot.
#
# NIST 800-53: AC-6 (Least Privilege), SI-7 - /run/plat holds the loader's
# state file (/run/plat/xdp.state, 0644 root), which platd and
# plat-fwguard trust: it must be root-owned and not group- or
# other-writable (the loader refuses otherwise, plat_xdp::load::StateDir).
# /run/plat/bpf is the dedicated bpffs mount (run-plat-bpf.mount): setgid
# so every pin the loader creates is group plat (0660 read-write maps,
# 0640 read-only maps; program and link pins 0600 root), traversable by
# group plat only.
# Type Path            Mode User Group Age
d     /run/plat        0755 root root  -
z     /run/plat/bpf    2750 root plat  -
