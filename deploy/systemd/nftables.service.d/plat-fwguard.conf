# Drop-in for the distribution's nftables.service: run the usg-plat forward
# policy guard synchronously right after nftables loads (start), reloads, or
# flushes (stop) the ruleset, so a ruleset without (or with a changed)
# `table inet plat` turns forwarding off before the unit job completes,
# instead of up to one plat-fwguard.timer interval later.
# Install as /etc/systemd/system/nftables.service.d/plat-fwguard.conf.
#
# Multiple ExecReload= lines run in order, so this one runs after the
# unit's own `nft -f` reload. '-': a guard failure never fails nftables.
# The guard runs inside nftables.service's sandbox, which must allow writes
# to /proc/sys/net (no ProtectKernelTunables=; true for the Debian and
# Fedora units).
#
# NIST 800-53: SC-7, SC-24 (fail closed after a ruleset change)
[Service]
ExecStartPost=-/usr/libexec/plat/plat-fwguard.sh
ExecReload=-/usr/libexec/plat/plat-fwguard.sh
ExecStopPost=-/usr/libexec/plat/plat-fwguard.sh
