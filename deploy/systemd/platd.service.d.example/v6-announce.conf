# Route announcement tied to platd (D-1, D-2, D-3): the NAT64 IPv6 prefix is
# announced only while platd runs and, with PLAT_V6_MODE=cluster, only while
# this node owns at least one pool slice of the current platd lifetime (the
# shipped slice hooks call `plat-v6-announce.sh slices`). Required with
# [cluster.ha] and the shipped FRR hooks, even without the IPv6 settings
# file (prestart/off then clean up only the IPv4 slices).
# Install as /etc/systemd/system/platd.service.d/v6-announce.conf with
# /usr/libexec/plat/plat-v6-announce.sh and /etc/default/plat-v6-announce
# (README "Route announcement"). '+' runs it as root (vtysh), '-' keeps a
# missing FRR from failing the unit.
#   ExecStartPre=  (after plat-tun-setup.sh, before platd exists): withdraw
#                  every slice `network` left from an earlier platd (crash),
#                  empty <state_dir>/announce.d, withdraw the IPv6 prefix and
#                  record this lifetime (INVOCATION_ID) in
#                  /run/plat-announce.owner, so stale files never count.
#   ExecStartPost= standalone: announce. cluster: apply the slice state
#                  (nothing owned yet, so withdrawn).
#   ExecStopPost=  runs after every exit, including a crash or SIGKILL:
#                  withdraw all slices and the prefix, clear announce.d and
#                  the owner file.
[Service]
ExecStartPre=+-/usr/libexec/plat/plat-v6-announce.sh prestart
ExecStartPost=+-/usr/libexec/plat/plat-v6-announce.sh on
ExecStopPost=+-/usr/libexec/plat/plat-v6-announce.sh off
