# XDP fast path (POAM-016 Phase 1, plan §7) for platd: only with [xdp]
# enabled = true in /etc/plat/platd.toml. Install as
# /etc/systemd/system/platd.service.d/xdp.conf, with
# /usr/libexec/plat/plat-xdp-loader, plat-xdp.service, run-plat-bpf.mount
# and /usr/lib/tmpfiles.d/plat-xdp.conf (README "XDP fast path"), then
# `systemctl daemon-reload && systemctl restart platd`.
#
# platd keeps no capabilities. It gains only the bpf(2) system call, to
# open the pins under /run/plat/bpf that group plat may access (0660
# read-write, 0640 read-only maps; BPF_F_RDONLY for the latter), look up,
# update, delete and mmap them. It cannot create maps or load programs
# (kernel.unprivileged_bpf_disabled >= 1, which the loader asserts), nor
# attach or detach (CAP_NET_ADMIN), nor read the program and link pins
# (0600 root).
#
# Ordering: plat-xdp.service attaches before platd starts and is bound to
# it (PartOf=, BindsTo= there), so every platd start, restart and
# automatic restart runs a fresh attach first; platd refuses maps an
# earlier platd used (stale_maps). If the attach fails, platd does not
# start (Requires=): the configured fast path fails closed and is visible
# as a failed unit instead of a silent TUN-only start.
#
# COMPLIANCE MAPPING:
# - NIST 800-53: AC-6 (Least Privilege) - no capability; one added system
#   call; DAC on a dedicated bpffs limits it to plat's pins
# - NIST 800-53: CM-7 (Least Functionality) - added only when [xdp] is used
# - NIST 800-53: SC-24 (Fail in Known State) - no start without a fresh
#   attach
[Unit]
Requires=plat-xdp.service
After=plat-xdp.service
RequiresMountsFor=/run/plat/bpf

[Service]
# bpf is in @privileged, which platd.service removes; re-added alone.
SystemCallFilter=bpf
# The pins and the loader's state file (/run/plat/xdp.state) are read
# only: BPF_OBJ_GET of a read-write pin and a writable mmap of a map work
# on a read-only mount (plan §7), so platd needs no write access here.
ReadOnlyPaths=/run/plat
# platd checks that every opened fd is a BPF map through
# /proc/self/fd/<fd> (plat_io::bpf_obj): it must stay readable. The
# ProtectProc=invisible and ProcSubset=pid of platd.service keep the
# process's own /proc/self; do not add settings that hide it.
