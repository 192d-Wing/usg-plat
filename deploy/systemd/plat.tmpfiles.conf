# usg-plat audit log directory. Install as /usr/lib/tmpfiles.d/plat.conf.
#
# NIST 800-53: AU-9 (Protection of Audit Information), AC-6 (Least Privilege)
# - writable by plat only, readable by group plat-log (log shippers,
# verify-log operators), setgid so files platd creates (0640) inherit the
# group. Managed here instead of LogsDirectory=, because systemd re-applies
# LogsDirectory= ownership and mode (plat:plat 0750, setgid cleared) after
# ExecStartPre= at every start (LINUX_VERIFICATION.md L13).
# plat-tun-setup.sh creates group plat-log and applies this file before
# platd starts; systemd-tmpfiles-setup.service applies it at boot.
# Type Path          Mode User Group    Age
d     /var/log/plat  2750 plat plat-log -
