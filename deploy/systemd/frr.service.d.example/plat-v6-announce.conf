# Optional (D-1, D-2, D-3): after an FRR restart, re-apply the route state:
# with platd down everything is withdrawn; with platd active only the slices
# written to <state_dir>/announce.d during the current platd lifetime (owner
# file matches platd's InvocationID) are re-announced, and the NAT64 prefix
# only while one exists (cluster) or always (standalone). Install as
# /etc/systemd/system/frr.service.d/plat-v6-announce.conf.
[Service]
ExecStartPost=-/bin/sh -c "sleep 2; /usr/libexec/plat/plat-v6-announce.sh sync"
