# /etc/usg-plat-verify/verify.conf - usg-plat install-time signature gate.
# Shell-sourced key=value, root:root 0644. Read by verify-pkg, apt-hook,
# fetch-sums, selftest, usg-plat-verify and the dnf plugin.
#
# The signer identity (packages.yml at the exact release tag) and the OIDC
# issuer are constants in verify-pkg and cannot be changed here.
#
# COMPLIANCE MAPPING:
# - NIST 800-53: CM-6 (Configuration Settings), CM-14 (Signed Components),
#   SI-7(15) (Code Authentication)

# Package names the gate enforces. Every other package passes untouched.
NAMES="platd usg-plat-verify"

# Repository host: must equal the `Pin: origin` value in
# /etc/apt/preferences.d/usg-plat (bare lowercase host, no scheme or port) and
# the host of the URIs in /etc/apt/sources.list.d/usg-plat.sources.
REPO_HOST=192d-wing.github.io

# Base URL for SHA256SUMS fetches (<base>/releases/<tag>/). https:// or, for an
# offline mirror, file:///path.
REPO_BASE=https://192d-wing.github.io/usg-plat-packages

# Operator-installed upstream cosign (never bundled), and its version floor.
# A missing or older cosign refuses every usg-plat install (fail closed).
COSIGN=/usr/local/bin/cosign
COSIGN_MIN=3.0.3

# GODEBUG passed to cosign; fips140=only keeps verification inside the Go
# native FIPS 140-3 module (its CMVP status is an organisational
# determination). Empty disables it.
COSIGN_GODEBUG=fips140=only

# 1 allows downgrades (USG_PLAT_ALLOW_DOWNGRADE=1 allows them for one run).
ALLOW_DOWNGRADE=0
