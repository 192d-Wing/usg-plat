# XDP kernel matrix (plan §11 level 3, decision Q1: minimum 6.1 LTS) and
# known-good package pins, read by fetch-kernel.sh.
#
# Every kernel is a Debian package, fetched through the same chain: InRelease
# signature (gpgv, debian-archive-keyring) -> Packages.xz sha256 from the
# signed Release -> .deb sha256 from Packages -> pin below, when present.
#
# kernel NAME BASE-URL SUITE VERSION-GLOB
#   The newest unsigned image from source `linux` in SUITE whose Version
#   matches VERSION-GLOB (sh case pattern): linux-image-<abi>-<arch>-unsigned,
#   or linux-binary-unsigned-<abi>-<arch> plus linux-modules-<abi>-<arch> (the
#   split layout of sid since 7.x). Live suites move with Debian point
#   releases; snapshot.debian.org sources are immutable and must be pinned.
kernel 6.1    https://deb.debian.org/debian                                bookworm 6.1.*
kernel 6.6    https://snapshot.debian.org/archive/debian/20240201T000000Z  sid      6.6.13-*
kernel 6.12   https://deb.debian.org/debian                                trixie   6.12.*
kernel latest https://deb.debian.org/debian                                sid      *

# pin DEB-FILE-NAME SHA256
#   If the resolved .deb has a pin, its sha256 must also equal the pin. A pin
#   can only reject a download, never admit one the signed chain refused.
