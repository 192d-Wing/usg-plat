# NIST 800-53: AC-6 (Least Privilege) - unprivileged service account for
# platd; no login shell, no home directory. Installed by the .deb and .rpm.
u plat - "usg-plat translator" /nonexistent /usr/sbin/nologin
# AU-9 - read access to /var/log/plat for log shippers and verify-log operators.
g plat-log -
