[package]
name = "platd"
description = "usg-plat daemon: multithreaded 464XLAT PLAT / stateful NAT64"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["tls"]
# FIPS TLS (AWS-LC FIPS module): mTLS management listener, RFC 5425
# syslog, revocation checking, and the SC-13 start gate. Without it the
# daemon refuses TLS configs and, with the default `tls.require_fips`,
# refuses to start: feature-off builds are lint/CI artefacts only.
tls = ["dep:plat-tls", "dep:rustls", "plat-audit/tls"]
# XDP fast path for established UDP sessions (POAM-016 Phase 1): opens the
# pins the privileged plat-xdp-loader created and mirrors sessions into
# them. Off by default; building it needs bpf-linker (the embedded object
# is the one the loader attaches; plan §15). With the feature off, the
# daemon refuses `[xdp] enabled = true` and is TUN-only as before.
xdp = ["dep:plat-xdp", "dep:plat-xdp-core", "plat-xdp/xdp"]

[dependencies]
plat-common.workspace = true
plat-xlat.workspace = true
plat-nat64.workspace = true
plat-audit.workspace = true
plat-io.workspace = true
plat-cluster.workspace = true
plat-tls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
plat-xdp = { workspace = true, optional = true }
plat-xdp-core = { workspace = true, optional = true }
clap.workspace = true
core_affinity.workspace = true
signal-hook.workspace = true
parking_lot.workspace = true
rustix.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
plat-packet.workspace = true
# mTLS management and FIPS start-policy tests (in-test PKI; no committed keys).
plat-tls = { workspace = true, features = ["test-hooks"] }
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
# verify-log accounted-gap test builds a checkpointed file by hand.
hex.workspace = true
sha2.workspace = true

[lints]
workspace = true

# Linux packages: `make deb`, `make rpm` (README "Packages").
# NIST 800-53: CM-2, CM-6 - the package installs the baseline unit, setup
# script, forward-policy guard and example config; AC-6 - the service account
# and plat-log group come from sysusers.d; AU-9 - /var/log/plat from
# tmpfiles.d. No unit is enabled or restarted by the package: an operator
# edits /etc/plat/platd.toml and enables plat-fwguard.timer and platd.
[package.metadata.deb]
maintainer = "usg-plat Contributors"
copyright = "usg-plat Contributors"
extended-description = "Multithreaded 464XLAT PLAT / stateful NAT64 translator (RFC 6877, RFC 6146, RFC 7915) with SIEM attribution logging."
section = "net"
priority = "optional"
# usg-plat-verify: the install-time signature gate (POAM-044 (c); SI-7(15), CM-14).
depends = "$auto, nftables, systemd, usg-plat-verify"
conf-files = ["/etc/plat/platd.toml"]
maintainer-scripts = "../../deploy/debian/"
systemd-units = [
    { unit-name = "platd", unit-scripts = "../../deploy/systemd/", enable = false, start = false, restart-after-upgrade = false, stop-on-upgrade = false },
    { unit-name = "plat-fwguard", unit-scripts = "../../deploy/systemd/", enable = false, start = false, restart-after-upgrade = false, stop-on-upgrade = false },
]
assets = [
    ["target/release/platd", "usr/bin/", "755"],
    ["../../deploy/systemd/plat-tun-setup.sh", "usr/libexec/plat/", "755"],
    ["../../deploy/systemd/plat-fwguard.sh", "usr/libexec/plat/", "755"],
    ["../../deploy/systemd/nftables.service.d/plat-fwguard.conf", "usr/lib/systemd/system/nftables.service.d/", "644"],
    ["../../deploy/systemd/plat.tmpfiles.conf", "usr/lib/tmpfiles.d/plat.conf", "644"],
    ["../../config/platd.example.toml", "etc/plat/platd.toml", "640"],
    ["../../deploy/sysusers.d/plat.conf", "usr/lib/sysusers.d/", "644"],
    ["../../deploy/systemd/plat-v6-announce.sh", "usr/libexec/plat/", "755"],
    ["../../deploy/hooks/frr-announce.sh", "usr/libexec/plat/", "755"],
    ["../../deploy/hooks/frr-withdraw.sh", "usr/libexec/plat/", "755"],
    ["../../deploy/systemd/platd.service.d.example/v6-announce.conf", "usr/share/doc/platd/examples/platd.service.d/", "644"],
    ["../../deploy/systemd/frr.service.d.example/plat-v6-announce.conf", "usr/share/doc/platd/examples/frr.service.d/", "644"],
    # XDP fast path (POAM-016; off unless [xdp] and the platd drop-in are
    # installed). The loader needs `make dist XDP=1` (embedded object).
    ["target/release/plat-xdp-loader", "usr/libexec/plat/", "755"],
    ["../../deploy/systemd/plat-xdp.service", "usr/lib/systemd/system/", "644"],
    ["../../deploy/systemd/run-plat-bpf.mount", "usr/lib/systemd/system/", "644"],
    ["../../deploy/systemd/plat-xdp.tmpfiles.conf", "usr/lib/tmpfiles.d/plat-xdp.conf", "644"],
    ["../../deploy/systemd/platd.service.d.example/xdp.conf", "usr/share/doc/platd/examples/platd.service.d/", "644"],
    # CM-8/SR-4: CycloneDX SBOM of this build (`make sbom`, run by `make deb`)
    # and the CBOM (docs/compliance/cbom.cdx.json).
    ["../../target/sbom/platd-sbom.cdx.json", "usr/share/doc/platd/sbom.cdx.json", "644"],
    ["../../docs/compliance/cbom.cdx.json", "usr/share/doc/platd/cbom.cdx.json", "644"],
]

[package.metadata.generate-rpm]
summary = "usg-plat 464XLAT PLAT / stateful NAT64 translator"
release = "1"
# usg-plat-verify: the install-time signature gate (POAM-044 (c); SI-7(15), CM-14).
requires = { nftables = "*", systemd = "*", usg-plat-verify = "*" }
post_install_script = "../../deploy/rpm/post_install.sh"
pre_uninstall_script = "../../deploy/rpm/pre_uninstall.sh"
post_uninstall_script = "../../deploy/rpm/post_uninstall.sh"
assets = [
    { source = "target/release/platd", dest = "/usr/bin/platd", mode = "755" },
    { source = "../../deploy/systemd/plat-tun-setup.sh", dest = "/usr/libexec/plat/plat-tun-setup.sh", mode = "755" },
    { source = "../../deploy/systemd/plat-fwguard.sh", dest = "/usr/libexec/plat/plat-fwguard.sh", mode = "755" },
    { source = "../../deploy/systemd/platd.service", dest = "/usr/lib/systemd/system/platd.service", mode = "644" },
    { source = "../../deploy/systemd/plat-fwguard.service", dest = "/usr/lib/systemd/system/plat-fwguard.service", mode = "644" },
    { source = "../../deploy/systemd/plat-fwguard.timer", dest = "/usr/lib/systemd/system/plat-fwguard.timer", mode = "644" },
    { source = "../../deploy/systemd/nftables.service.d/plat-fwguard.conf", dest = "/usr/lib/systemd/system/nftables.service.d/plat-fwguard.conf", mode = "644" },
    { source = "../../deploy/systemd/plat.tmpfiles.conf", dest = "/usr/lib/tmpfiles.d/plat.conf", mode = "644" },
    { source = "../../config/platd.example.toml", dest = "/etc/plat/platd.toml", mode = "640", config = "noreplace" },
    { source = "../../deploy/sysusers.d/plat.conf", dest = "/usr/lib/sysusers.d/plat.conf", mode = "644" },
    { source = "../../deploy/systemd/plat-v6-announce.sh", dest = "/usr/libexec/plat/plat-v6-announce.sh", mode = "755" },
    { source = "../../deploy/hooks/frr-announce.sh", dest = "/usr/libexec/plat/frr-announce.sh", mode = "755" },
    { source = "../../deploy/hooks/frr-withdraw.sh", dest = "/usr/libexec/plat/frr-withdraw.sh", mode = "755" },
    { source = "../../deploy/systemd/platd.service.d.example/v6-announce.conf", dest = "/usr/share/doc/platd/examples/platd.service.d/v6-announce.conf", mode = "644", doc = true },
    { source = "../../deploy/systemd/frr.service.d.example/plat-v6-announce.conf", dest = "/usr/share/doc/platd/examples/frr.service.d/plat-v6-announce.conf", mode = "644", doc = true },
    { source = "target/release/plat-xdp-loader", dest = "/usr/libexec/plat/plat-xdp-loader", mode = "755" },
    { source = "../../deploy/systemd/plat-xdp.service", dest = "/usr/lib/systemd/system/plat-xdp.service", mode = "644" },
    { source = "../../deploy/systemd/run-plat-bpf.mount", dest = "/usr/lib/systemd/system/run-plat-bpf.mount", mode = "644" },
    { source = "../../deploy/systemd/plat-xdp.tmpfiles.conf", dest = "/usr/lib/tmpfiles.d/plat-xdp.conf", mode = "644" },
    { source = "../../deploy/systemd/platd.service.d.example/xdp.conf", dest = "/usr/share/doc/platd/examples/platd.service.d/xdp.conf", mode = "644", doc = true },
    { source = "../../target/sbom/platd-sbom.cdx.json", dest = "/usr/share/doc/platd/sbom.cdx.json", mode = "644", doc = true },
    { source = "../../docs/compliance/cbom.cdx.json", dest = "/usr/share/doc/platd/cbom.cdx.json", mode = "644", doc = true },
]
