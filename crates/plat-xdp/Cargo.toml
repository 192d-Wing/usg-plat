[package]
name = "plat-xdp"
description = "Userspace side of the usg-plat XDP fast path: loader library, pinned-map writer (SLOT/SLICE/CONTROL), slot allocator, heartbeat and counters"
version.workspace = true
edition.workspace = true
license.workspace = true
# Aya needs 1.98.
rust-version = "1.98"
publish.workspace = true

[features]
default = []
# Build the plat-xdp-ebpf object (bpf-linker, nested bpfel-unknown-none
# build in build.rs) and embed it. Off by default, so `cargo build/test/
# clippy --workspace` never needs bpf-linker (plan §15).
xdp = []
# The WU5 lock-hold gate harness (`tests/hold_gate.rs`, VM, root): the
# `bib4` hold-time probe of plat-nat64. Measurement builds only.
hold-gate = ["plat-nat64/hold-probe"]

[dependencies]
plat-common.workspace = true
plat-xdp-core.workspace = true
# The `plat_nat64::mirror::Mirror` glue (`impl Mirror for XdpMirror`).
plat-nat64.workspace = true
plat-cluster.workspace = true
plat-packet.workspace = true
parking_lot.workspace = true
sha2.workspace = true
thiserror.workspace = true
hex.workspace = true

# Linux only: BPF syscalls, mmap, program load and attach. Aya is an exact
# workspace pin; its internal `unsafe` is a reviewed dependency (SR-3).
[target.'cfg(target_os = "linux")'.dependencies]
plat-io.workspace = true
aya.workspace = true
rustix = { workspace = true, features = ["fs", "rand", "thread", "time"] }
# The loader parses the object before loading it to refuse an `xdp.frags`
# section (SEC-001); `Xdp::from_pin` in the level-2 harness takes its
# `XdpAttachType`, which aya 0.16 does not re-export. Same version Aya
# already pulls in.
aya-obj = "=0.6.0"

[dev-dependencies]
# `glue` tests drive a real engine with the plat-nat64 test fixtures
# (`tests/common`), included by path.
plat-audit.workspace = true
plat-xlat.workspace = true
crossbeam-channel.workspace = true

[[test]]
name = "hold_gate"
required-features = ["hold-gate"]

[lints]
workspace = true
