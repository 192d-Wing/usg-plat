[package]
name = "plat-audit"
description = "Non-blocking, hash-chained NAT attribution logging with SIEM export for usg-plat"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["tls"]
# RFC 5425 TLS syslog transport (AWS-LC FIPS via plat-tls). Off only for
# lint builds on hosts without a C cross compiler; with it off, a
# `transport = "tls"` destination fails `Logger::spawn`.
tls = ["dep:plat-tls", "dep:rustls", "dep:rustls-pki-types"]

[dependencies]
plat-common.workspace = true
plat-tls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
crossbeam-channel.workspace = true
crossbeam-utils.workspace = true
hex.workspace = true
sha2.workspace = true
tracing.workspace = true

# AU-5(1): free space on the log volume (safe `statvfs`, no `unsafe` here).
# Same version the lock file already carries (via tempfile).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

# AU-9(2) / POAM-018: UDP syslog batches with the safe `sendmmsg` wrapper.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "net", "std"] }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
# TLS syslog integration tests (in-test collector and PKI; no committed keys).
plat-tls.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true

[[bench]]
name = "audit"
harness = false

[lints]
workspace = true
