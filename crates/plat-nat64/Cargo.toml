[package]
name = "plat-nat64"
description = "Stateful NAT64 (RFC 6146) engine with bulk port allocation for usg-plat"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
plat-common.workspace = true
plat-packet.workspace = true
plat-xlat.workspace = true
plat-audit.workspace = true
plat-cluster.workspace = true
ahash.workspace = true
crossbeam-channel.workspace = true
crossbeam-utils.workspace = true
parking_lot.workspace = true

[features]
default = []
# SEC-008: `mirror::ModelMirror` (one model-wide mutex) is test support
# only and absent from production builds. Integration tests and benches
# enable it through the self dev-dependency below; plat-xdp-core's
# differential tests enable it in their dev-dependency.
model = []
# `bib4` hold-time histograms (`probe`): measurement builds only (the
# POAM-016 WU5 lock-hold gate, plat-xdp `tests/hold_gate.rs`).
hold-probe = []

[dev-dependencies]
plat-nat64 = { path = ".", features = ["model"] }
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "nat64"
harness = false

[[bench]]
name = "adopt_slice"
harness = false

[lints]
workspace = true
