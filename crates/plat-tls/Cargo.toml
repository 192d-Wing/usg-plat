[package]
name = "plat-tls"
description = "FIPS TLS policy, certificate loading, peer identity and revocation checking for usg-plat (management and syslog only)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Test-only switch that makes `require_fips` fail as if the FIPS module were
# inactive (start-policy tests in platd). Never enabled in release builds.
test-hooks = []

[dependencies]
plat-common.workspace = true
aws-lc-rs.workspace = true
der.workspace = true
parking_lot.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
thiserror.workspace = true
tracing.workspace = true
x509-cert.workspace = true
x509-ocsp.workspace = true
zeroize.workspace = true

# Key-file ownership (safe `geteuid`/`getegid`, no `unsafe` here).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }

[dev-dependencies]
rcgen.workspace = true
proptest.workspace = true

[lints]
workspace = true
