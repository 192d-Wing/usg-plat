[package]
name = "plat-tls"
description = "FIPS TLS policy, certificate loading, peer identity and revocation checking for usg-plat (management and syslog only)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Test-only switch that makes `require_fips` fail as if the FIPS module were
# inactive (start-policy tests in platd). Never enabled in release builds.
test-hooks = []

[dependencies]
plat-common.workspace = true
aws-lc-rs.workspace = true
# COMPLIANCE MAPPING:
# - NIST 800-53: SC-13, CM-2 - pins the FIPS module line. aws-lc-fips-sys
#   0.14.x bundles AWS-LC-FIPS 4.x (4.2.0), which is on the CMVP "Modules In
#   Process" list: NOT validated (certificates #5298/#5314 cover AWS-LC-FIPS
#   v3.1 only). Moving off this line is a deliberate, reviewed change.
# POAM: POAM-026 AWS-LC-FIPS 4.x CMVP certificate pending; re-check and confirm OEs.
aws-lc-fips-sys = "~0.14.4"
der.workspace = true
parking_lot.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
thiserror.workspace = true
tracing.workspace = true
x509-cert.workspace = true
x509-ocsp.workspace = true
zeroize.workspace = true

# Key-file ownership (safe `geteuid`/`getegid`, no `unsafe` here).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }

[dev-dependencies]
rcgen.workspace = true
proptest.workspace = true

[lints]
workspace = true
