# NIST 800-53: CM-2 (Baseline Configuration), SI-7 (Software Integrity),
# SR-3 (Supply Chain Controls) - .deb and .rpm built natively per
# architecture, so the AWS-LC FIPS module is compiled by the host toolchain
# and never cross-linked (SC-13). Every third-party action is pinned to a full
# commit SHA (tag in trailing comment); packaging tools are pinned versions.
# SBOM (CycloneDX, per architecture; default and xdp builds) and CBOM are
# attached as artifacts and installed in the packages under
# /usr/share/doc/platd/; the shipped binaries carry cargo-auditable data and
# `cargo audit bin` must pass on them. On `v*` tags only, the `release` job
# writes SHA256SUMS, signs it and every artifact with Sigstore cosign keyless
# (GitHub Actions OIDC identity, public Rekor log; .sigstore.json bundles),
# adds GitHub build provenance attestations and publishes a GitHub Release.
# Pushes, PRs and dispatch runs never sign or publish. apt/dnf repository
# metadata is out of scope (POAM-044).
# COMPLIANCE MAPPING:
# - NIST 800-53: CM-8 (System Component Inventory), SR-4 (Provenance), RA-5
#   (Vulnerability Monitoring and Scanning), SI-7 (Software Integrity),
#   SR-11 (Component Authenticity), CM-14 (Signed Components)
name: Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # apt-get: give up on a stalled mirror after 30 s and retry, instead of
  # hanging until the job timeout (an Ubuntu mirror stall cancelled
  # fmt + clippy on #54 and #56 after 30 minutes).
  APT_OPTS: -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  packages:
    name: deb + rpm (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # Tag (release) builds start clean: no cache restored from main.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          key: packages-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: PLAT_CBOM_BLESS is unset (the CBOM is never re-blessed in CI)
        run: |
          if [ -n "${PLAT_CBOM_BLESS+set}" ]; then
            echo "::error::PLAT_CBOM_BLESS is set; re-bless docs/compliance/cbom.cdx.json locally and review the diff"
            exit 1
          fi
      - name: Install AWS-LC FIPS build deps (CMake, Go, clang), dpkg-dev, rpm2cpio and binutils
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y --no-install-recommends cmake golang-go clang dpkg-dev rpm2cpio cpio binutils
      - name: Install packaging, SBOM and audit tools (version- and checksum-pinned)
        run: deploy/tests/supply-chain/install-cargo-tools.sh
      - name: Install check-jsonschema (version- and hash-pinned, wheels only)
        run: |
          python3 -m venv "$RUNNER_TEMP/cj"
          "$RUNNER_TEMP/cj/bin/pip" install --require-hashes --only-binary :all: -r deploy/tests/supply-chain/requirements-jsonschema.txt
          echo "CHECK_JSONSCHEMA=$RUNNER_TEMP/cj/bin/check-jsonschema" >> "$GITHUB_ENV"
      - run: make packages
      - name: Show package metadata and contents
        run: |
          for f in target/debian/*.deb; do dpkg-deb --info "$f"; dpkg-deb --contents "$f"; done
          ls -l target/generate-rpm/*.rpm
      - name: cargo audit bin on the dist binaries (fails on an advisory)
        run: cargo audit bin target/dist/platd target/dist/plat-xdp-loader
      - name: Packages carry the SBOM and CBOM, byte-equal, and auditable binaries
        run: |
          set -eu
          check_tree() {
            local root="$1"
            for f in sbom:target/sbom/platd-sbom.cdx.json cbom:docs/compliance/cbom.cdx.json; do
              cmp "$root/usr/share/doc/platd/${f%%:*}.cdx.json" "${f#*:}"
            done
            cargo audit bin "$root/usr/bin/platd" "$root/usr/libexec/plat/plat-xdp-loader"
          }
          deb=$(mktemp -d); dpkg-deb -x target/debian/*.deb "$deb"; check_tree "$deb"
          rpm=$(mktemp -d); (cd "$rpm" && rpm2cpio "$GITHUB_WORKSPACE"/target/generate-rpm/*.rpm | cpio -id --quiet); check_tree "$rpm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platd-packages-${{ matrix.arch }}
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/sbom/*.cdx.json
            docs/compliance/cbom.cdx.json
          if-no-files-found: error

  # SBOM of the `xdp` build: platd and plat-xdp-loader with --features xdp
  # and the eBPF object as a nested component (hash = gated = embedded, T8).
  # Runs on every PR and is a required check (user decision N1).
  sbom-xdp:
    name: sbom xdp (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The workspace build environment has no RUSTC_BOOTSTRAP
        run: |
          if [ -n "${RUSTC_BOOTSTRAP+set}" ]; then
            echo "::error::RUSTC_BOOTSTRAP is set for the workspace build (plan §15)"
            exit 1
          fi
      - name: PLAT_CBOM_BLESS is unset (the CBOM is never re-blessed in CI)
        run: |
          if [ -n "${PLAT_CBOM_BLESS+set}" ]; then
            echo "::error::PLAT_CBOM_BLESS is set; re-bless docs/compliance/cbom.cdx.json locally and review the diff"
            exit 1
          fi
      - name: Install pinned toolchain from rust-toolchain.toml (incl. rust-src)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # Tag (release) builds start clean: no cache restored from main.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          key: sbom-xdp-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install AWS-LC FIPS build deps (CMake, Go, clang), zstd and binutils
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y --no-install-recommends cmake golang-go clang zstd binutils
      - name: Install bpf-linker 0.12.0 (release tarball, sha256-pinned)
        run: |
          deploy/tests/xdp/install-bpf-linker.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: rustc and bpf-linker share one LLVM major
        run: deploy/tests/xdp/check-llvm-major.sh "$HOME/.local/bin/bpf-linker"
      - name: Install packaging, SBOM and audit tools (version- and checksum-pinned)
        run: deploy/tests/supply-chain/install-cargo-tools.sh
      - name: Install check-jsonschema (version- and hash-pinned, wheels only)
        run: |
          python3 -m venv "$RUNNER_TEMP/cj"
          "$RUNNER_TEMP/cj/bin/pip" install --require-hashes --only-binary :all: -r deploy/tests/supply-chain/requirements-jsonschema.txt
          echo "CHECK_JSONSCHEMA=$RUNNER_TEMP/cj/bin/check-jsonschema" >> "$GITHUB_ENV"
      - name: make xdp (gated eBPF object and its checks)
        run: make xdp
      - name: make sbom XDP=1 (auditable dist build with xdp, T6-T8)
        run: make sbom XDP=1
      - name: cargo audit bin on the xdp dist binaries (fails on an advisory)
        run: cargo audit bin target/dist/platd target/dist/plat-xdp-loader
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platd-sbom-xdp-${{ matrix.arch }}
          path: |
            target/sbom/platd-xdp-*.cdx.json
            target/xdp/plat-xdp-ebpf.sha256
            docs/compliance/cbom.cdx.json
          if-no-files-found: error

  # POAM: POAM-044 (untested until the first tag; public Sigstore; repo
  # metadata unsigned; signatures not enforced at install)
  # Tag-only: checksum, sign (cosign keyless) and publish. The only job with
  # id-token: write and contents: write. Verify with scripts/verify-release.sh.
  release:
    name: sign + publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [packages, sbom-xdp]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write     # create the GitHub Release
      id-token: write     # OIDC token for the Fulcio certificate and attestations
      attestations: write # build provenance attestations
    env:
      COSIGN_VERSION: v3.1.4
      COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa # cosign-linux-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the workspace version
        run: |
          ws=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "v$ws" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $ws"; exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect release files and write SHA256SUMS
        run: |
          mkdir dist
          # Fail on a name collision instead of silently keeping one copy.
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name 'platd-*-*.cdx.json' \) -print0 |
            while IFS= read -r -d '' f; do
              b=$(basename "$f")
              if [ -e "dist/$b" ]; then echo "::error::duplicate release file name $b ($f)"; exit 1; fi
              cp "$f" "dist/$b"
            done
          cp artifacts/platd-packages-x86_64/docs/compliance/cbom.cdx.json dist/platd-cbom.cdx.json
          for a in x86_64 aarch64; do
            cp "artifacts/platd-sbom-xdp-$a/target/xdp/plat-xdp-ebpf.sha256" "dist/plat-xdp-ebpf-$a.sha256"
          done
          # 2 arches x (deb + rpm + SBOM + xdp SBOM + eBPF hash) + CBOM = 11
          n=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "$n" -ne 11 ]; then echo "::error::expected 11 release files, found $n"; ls -l dist; exit 1; fi
          cd dist && sha256sum -- * | LC_ALL=C sort -k2 > SHA256SUMS && cat SHA256SUMS
      - name: Install cosign (pinned version and SHA-256)
        run: |
          curl --proto =https --tlsv1.2 -fsSLo "$RUNNER_TEMP/cosign" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/cosign" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/cosign" /usr/local/bin/cosign
          cosign version
      - name: Sign SHA256SUMS and every artifact (keyless, Rekor)
        working-directory: dist
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Self-verify before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release.sh dist "$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "usg-plat $GITHUB_REF_NAME" --notes "See CHANGELOG.md. Verify with scripts/verify-release.sh." \
            dist/*
