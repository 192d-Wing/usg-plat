# NIST 800-53: SI-7 (Software Integrity), SR-3 (Supply Chain Controls), CM-2 (pinned toolchain),
# CM-8 (System Component Inventory: CBOM drift checks T1 in `test`, T3-T5 in `check`).
# Every third-party action is pinned to a full commit SHA (tag in trailing comment).
# The Rust toolchain comes from rust-toolchain.toml (rustup on the runner reads it).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # apt-get: give up on a stalled mirror after 30 s and retry, instead of
  # hanging until the job timeout (an Ubuntu mirror stall cancelled
  # fmt + clippy on #54 and #56 after 30 minutes).
  APT_OPTS: -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt + clippy (host and aarch64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install AWS-LC FIPS build deps (CMake, Go, clang, aarch64 cross gcc)
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y --no-install-recommends cmake golang-go clang gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross
      - name: PLAT_CBOM_BLESS is unset (the CBOM is never re-blessed in CI)
        run: |
          if [ -n "${PLAT_CBOM_BLESS+set}" ]; then
            echo "::error::PLAT_CBOM_BLESS is set; re-bless docs/compliance/cbom.cdx.json locally and review the diff"
            exit 1
          fi
      - run: make fmt
      - run: make codex-agents-check
      - name: Install check-jsonschema (version- and hash-pinned, wheels only)
        run: |
          python3 -m venv "$RUNNER_TEMP/cj"
          "$RUNNER_TEMP/cj/bin/pip" install --require-hashes --only-binary :all: -r deploy/tests/supply-chain/requirements-jsonschema.txt
          echo "CHECK_JSONSCHEMA=$RUNNER_TEMP/cj/bin/check-jsonschema" >> "$GITHUB_ENV"
      - name: make cbom-check (CBOM drift T3-T5, supply-chain script self-tests)
        run: make cbom-check
      - run: make clippy
      - name: make check-linux (aarch64, TLS on)
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: make check-linux
      - name: make check-notls (TLS feature off)
        run: make check-notls

  test:
    name: test (native Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install AWS-LC FIPS build deps (CMake, Go, clang)
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y --no-install-recommends cmake golang-go clang
      - name: Restore tool downloads (shellcheck, bpf-linker)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/plat-tools
          key: plat-tools-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/tests/install-shellcheck.sh', 'deploy/tests/xdp/install-bpf-linker.sh') }}
      - name: Install shellcheck 0.11.0 (release tarball, sha256-pinned)
        run: |
          PLAT_TOOL_CACHE="$HOME/.cache/plat-tools" deploy/tests/install-shellcheck.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: PLAT_CBOM_BLESS is unset (the CBOM is never re-blessed in CI)
        run: |
          if [ -n "${PLAT_CBOM_BLESS+set}" ]; then
            echo "::error::PLAT_CBOM_BLESS is set; re-bless docs/compliance/cbom.cdx.json locally and review the diff"
            exit 1
          fi
      - run: make test
      - name: Deploy script test (stubbed, real check-config output)
        run: make test-deploy

  security:
    name: supply chain (cargo-audit, cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - run: make security

  # XDP fast path (POAM-016 Phase 1, plan §15). NIST 800-53: SA-15, CM-2, SA-11.
  # Pinned bpf-linker (sha256), LLVM-major match with rustc, bpfel build and
  # object checks on both architectures. Steps for crates that are not in the
  # tree yet skip with a message (Makefile). Reports on every push; it becomes
  # a required check on main when WU2/WU3 add the eBPF object.
  xdp-build:
    name: xdp build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The workspace build environment has no RUSTC_BOOTSTRAP
        run: |
          if [ -n "${RUSTC_BOOTSTRAP+set}" ]; then
            echo "::error::RUSTC_BOOTSTRAP is set for the workspace build (plan §15)"
            exit 1
          fi
      - name: Install pinned toolchain from rust-toolchain.toml (incl. rust-src)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install tools (zstd) and AWS-LC FIPS build deps
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y --no-install-recommends zstd cmake golang-go clang
      - name: Restore tool downloads (shellcheck, bpf-linker)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/plat-tools
          key: plat-tools-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/tests/install-shellcheck.sh', 'deploy/tests/xdp/install-bpf-linker.sh') }}
      - name: Install shellcheck 0.11.0 (release tarball, sha256-pinned)
        run: PLAT_TOOL_CACHE="$HOME/.cache/plat-tools" deploy/tests/install-shellcheck.sh "$HOME/.local/bin"
      - name: Install bpf-linker 0.12.0 (release tarball, sha256-pinned)
        run: |
          PLAT_TOOL_CACHE="$HOME/.cache/plat-tools" deploy/tests/xdp/install-bpf-linker.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: rustc and bpf-linker share one LLVM major
        run: deploy/tests/xdp/check-llvm-major.sh "$HOME/.local/bin/bpf-linker"
      - name: make check-xdp (scripts, bpfel clippy, xdp-feature clippy)
        run: make check-xdp
      - name: make xdp (bpfel build, eBPF object, licence, helper and loop checks, sha256)
        run: make xdp
      - name: The object is reproducible from another directory and has no host paths (SEC-001)
        run: deploy/tests/xdp/check-repro.sh target/xdp/plat-xdp-ebpf "$RUNNER_TEMP/xdp-repro"

  # Level-1 differential harness at the plan §11 case count (a required check
  # on main, like xdp-build; NIST 800-53: SA-11(1)). Release build: the 1M cases take
  # minutes there and hours in debug.
  xdp-proptest:
    name: xdp core proptest (1M cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The workspace build environment has no RUSTC_BOOTSTRAP
        run: |
          if [ -n "${RUSTC_BOOTSTRAP+set}" ]; then
            echo "::error::RUSTC_BOOTSTRAP is set for the workspace build (plan §15)"
            exit 1
          fi
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install AWS-LC FIPS build deps (CMake, Go, clang)
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y --no-install-recommends cmake golang-go clang
      - name: PROPTEST_CASES=1000000 cargo test -p plat-xdp-core (release)
        env:
          PROPTEST_CASES: "1000000"
        run: cargo test -p plat-xdp-core --release

  # Kernel matrix (plan §11 level 3, decision Q1). Kernels are Debian packages
  # verified through the signed InRelease (deploy/tests/xdp/fetch-kernel.sh),
  # booted with virtme-ng: KVM on x86_64, TCG through qemu-tcg.sh on arm64.
  # Today: boot, kernel smoke test (XDP load + BPF_PROG_TEST_RUN), the
  # plat-xdp-ebpf object's stack/instruction gate and level-2 smoke vectors
  # (obj-gate.py; the object is built here with the pinned bpf-linker, as in
  # xdp-build), netns and e2e topologies; the full level 2 and level 4 skip
  # until WU3/WU5. Becomes a required check on main before [xdp] is
  # documented as supported.
  xdp-vm:
    name: xdp vm (${{ matrix.kernel }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # [xdp] minimum is 6.6 LTS (user decision 2026-11-01).
        kernel: ["6.6", "6.12", "latest"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            qemu: qemu-system-x86
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qemu: qemu-system-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      XDP_KERNELS: ${{ matrix.kernel }}
      XDP_VNG_FLAGS: -m
      QEMU_PKG: ${{ matrix.qemu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The workspace build environment has no RUSTC_BOOTSTRAP
        run: |
          if [ -n "${RUSTC_BOOTSTRAP+set}" ]; then
            echo "::error::RUSTC_BOOTSTRAP is set for the workspace build (plan §15)"
            exit 1
          fi
      - name: Install pinned toolchain from rust-toolchain.toml (incl. rust-src)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install virtme-ng, QEMU, gpgv and the Debian archive keyring
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends virtme-ng "$QEMU_PKG" busybox-static file kmod \
            gpgv debian-archive-keyring xz-utils iproute2 iputils-ping zstd
      - name: Restore tool downloads (shellcheck, bpf-linker)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/plat-tools
          key: plat-tools-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/tests/install-shellcheck.sh', 'deploy/tests/xdp/install-bpf-linker.sh') }}
      - name: Install bpf-linker 0.12.0 (release tarball, sha256-pinned)
        run: |
          PLAT_TOOL_CACHE="$HOME/.cache/plat-tools" deploy/tests/xdp/install-bpf-linker.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: rustc and bpf-linker share one LLVM major
        run: deploy/tests/xdp/check-llvm-major.sh "$HOME/.local/bin/bpf-linker"
      - name: Allow the runner user to open /dev/kvm (when the host offers it)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "no /dev/kvm: TCG"
          fi
      # snapshot.debian.org (the 6.6 source) returns 503/504 for hours at a
      # time. Its files never change, so keep them between runs; the
      # signature and sha256 checks in fetch-kernel.sh still run on every use.
      - name: Restore snapshot.debian.org downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/plat-xdp-snapshot
          key: xdp-snapshot-${{ matrix.kernel }}-${{ matrix.arch }}-${{ hashFiles('deploy/tests/xdp/kernels.conf') }}
      - name: make test-xdp (object build, fetch, verify, boot, guest checks and object gates)
        run: XDP_FETCH_CACHE="$HOME/.cache/plat-xdp-snapshot" make test-xdp
      - name: Record the kernel package and verification
        if: always()
        run: cat target/xdp-kernels/*/kernel.env >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Warn when a kernel resolved without a sha256 pin (SEC-003)
        if: always()
        run: |
          for f in target/xdp-kernels/*/kernel.env; do
            [ -f "$f" ] || continue
            if grep -qx 'XDP_KERNEL_PINNED=no' "$f"; then
              echo "::warning title=unpinned test kernel::$(basename "$(dirname "$f")") resolved with XDP_KERNEL_PINNED=no (verified through the signed InRelease only; pin its sha256 in deploy/tests/xdp/kernels.conf)"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xdp-vm-${{ matrix.kernel }}-${{ matrix.arch }}
          path: |
            target/xdp-vm/*.log
            target/xdp-kernels/*/kernel.env
            target/xdp/plat-xdp-ebpf.sha256
          if-no-files-found: ignore
          retention-days: 14

  # POAM-044 (c) install-time gate: real apt / dnf4 in containers (images
  # pinned by index digest in the scripts) against a local HTTPS repository
  # with a stand-in cosign (run.sh), then upstream cosign v3.1.4 with the
  # pinned trust root against the real v0.3.0 release, --network none
  # (real-release.sh).
  verify-install:
    name: verify-install (${{ matrix.distro }}, ${{ matrix.runner }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        distro: [debian12, ubuntu2404, rocky9, rocky10]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rpm (rpmbuild for make verify-pkg)
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y --no-install-recommends rpm
      - name: Restore tool downloads (cosign)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/plat-tools
          key: plat-tools-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/tests/verify/install/real-release.sh') }}
      - name: Install cosign v3.1.4 (release binary, sha256-pinned)
        run: |
          c=$(PLAT_TOOL_CACHE="$HOME/.cache/plat-tools" sh deploy/tests/verify/install/real-release.sh --fetch-cosign "$RUNNER_TEMP/cosign")
          echo "COSIGN=$c" >> "$GITHUB_ENV"
      - name: make verify-pkg (trusted root checked against the pin)
        run: make verify-pkg
      - name: Install-time gate tests (stub cosign, local HTTPS repository)
        run: sh deploy/tests/verify/install/run.sh --engine docker --work target/verify-install ${{ matrix.distro }}
      - name: Real release, real cosign, no network
        run: sh deploy/tests/verify/install/real-release.sh --engine docker --work target/verify-real ${{ matrix.distro }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-install-${{ matrix.distro }}-${{ runner.arch }}
          path: |
            target/verify-install/out-*/
            target/verify-real/out-*/
          if-no-files-found: ignore
          retention-days: 14
