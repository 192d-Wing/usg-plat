# NIST 800-53: SI-7 (Software Integrity), SR-3 (Supply Chain Controls), CM-2 (pinned toolchain).
# Every third-party action is pinned to a full commit SHA (tag in trailing comment).
# The Rust toolchain comes from rust-toolchain.toml (rustup on the runner reads it).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt + clippy (host and aarch64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install AWS-LC FIPS build deps (CMake, Go, clang, aarch64 cross gcc)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake golang-go clang gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross
      - run: make fmt
      - run: make clippy
      - name: make check-linux (aarch64, TLS on)
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: make check-linux
      - name: make check-notls (TLS feature off)
        run: make check-notls

  test:
    name: test (native Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install AWS-LC FIPS build deps (CMake, Go, clang)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake golang-go clang shellcheck
      - run: make test
      - name: Deploy script test (stubbed, real check-config output)
        run: make test-deploy

  security:
    name: supply chain (cargo-audit, cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - run: make security

  # XDP fast path (POAM-016 Phase 1, plan §15). NIST 800-53: SA-15, CM-2, SA-11.
  # Pinned bpf-linker (sha256), LLVM-major match with rustc, bpfel build and
  # object checks on both architectures. Steps for crates that are not in the
  # tree yet skip with a message (Makefile). Reports on every push; it becomes
  # a required check on main when WU2/WU3 add the eBPF object.
  xdp-build:
    name: xdp build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The workspace build environment has no RUSTC_BOOTSTRAP
        run: |
          if [ -n "${RUSTC_BOOTSTRAP+set}" ]; then
            echo "::error::RUSTC_BOOTSTRAP is set for the workspace build (plan §15)"
            exit 1
          fi
      - name: Install pinned toolchain from rust-toolchain.toml (incl. rust-src)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install tools (zstd, shellcheck) and AWS-LC FIPS build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd shellcheck cmake golang-go clang
      - name: Install bpf-linker 0.12.0 (release tarball, sha256-pinned)
        run: |
          deploy/tests/xdp/install-bpf-linker.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: rustc and bpf-linker share one LLVM major
        run: deploy/tests/xdp/check-llvm-major.sh "$HOME/.local/bin/bpf-linker"
      - name: make check-xdp (scripts, bpfel clippy, xdp-feature clippy)
        run: make check-xdp
      - name: make xdp (bpfel build, eBPF object, licence, helper and loop checks, sha256)
        run: make xdp

  # Level-1 differential harness at the plan §11 case count (advisory, like
  # xdp-build; NIST 800-53: SA-11(1), advisory until WU8). Release build: the 1M cases take
  # minutes there and hours in debug.
  xdp-proptest:
    name: xdp core proptest (1M cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The workspace build environment has no RUSTC_BOOTSTRAP
        run: |
          if [ -n "${RUSTC_BOOTSTRAP+set}" ]; then
            echo "::error::RUSTC_BOOTSTRAP is set for the workspace build (plan §15)"
            exit 1
          fi
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install AWS-LC FIPS build deps (CMake, Go, clang)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake golang-go clang
      - name: PROPTEST_CASES=1000000 cargo test -p plat-xdp-core (release)
        env:
          PROPTEST_CASES: "1000000"
        run: cargo test -p plat-xdp-core --release

  # Kernel matrix (plan §11 level 3, decision Q1). Kernels are Debian packages
  # verified through the signed InRelease (deploy/tests/xdp/fetch-kernel.sh),
  # booted with virtme-ng: KVM on x86_64, TCG through qemu-tcg.sh on arm64.
  # Today: boot, kernel smoke test (XDP load + BPF_PROG_TEST_RUN), the
  # plat-xdp-ebpf object's stack/instruction gate and level-2 smoke vectors
  # (obj-gate.py; the object is built here with the pinned bpf-linker, as in
  # xdp-build), netns and e2e topologies; the full level 2 and level 4 skip
  # until WU3/WU5. Becomes a required check on main before [xdp] is
  # documented as supported.
  xdp-vm:
    name: xdp vm (${{ matrix.kernel }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        kernel: ["6.1", "6.6", "6.12", "latest"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            qemu: qemu-system-x86
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qemu: qemu-system-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      XDP_KERNELS: ${{ matrix.kernel }}
      XDP_VNG_FLAGS: -m
      QEMU_PKG: ${{ matrix.qemu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The workspace build environment has no RUSTC_BOOTSTRAP
        run: |
          if [ -n "${RUSTC_BOOTSTRAP+set}" ]; then
            echo "::error::RUSTC_BOOTSTRAP is set for the workspace build (plan §15)"
            exit 1
          fi
      - name: Install pinned toolchain from rust-toolchain.toml (incl. rust-src)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install virtme-ng, QEMU, gpgv and the Debian archive keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends virtme-ng "$QEMU_PKG" busybox-static file kmod \
            gpgv debian-archive-keyring xz-utils iproute2 iputils-ping zstd
      - name: Install bpf-linker 0.12.0 (release tarball, sha256-pinned)
        run: |
          deploy/tests/xdp/install-bpf-linker.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: rustc and bpf-linker share one LLVM major
        run: deploy/tests/xdp/check-llvm-major.sh "$HOME/.local/bin/bpf-linker"
      - name: Allow the runner user to open /dev/kvm (when the host offers it)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "no /dev/kvm: TCG"
          fi
      - name: make test-xdp (object build, fetch, verify, boot, guest checks and object gates)
        run: make test-xdp
      - name: Record the kernel package and verification
        if: always()
        run: cat target/xdp-kernels/*/kernel.env >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Warn when a kernel resolved without a sha256 pin (SEC-003)
        if: always()
        run: |
          for f in target/xdp-kernels/*/kernel.env; do
            [ -f "$f" ] || continue
            if grep -qx 'XDP_KERNEL_PINNED=no' "$f"; then
              echo "::warning title=unpinned test kernel::$(basename "$(dirname "$f")") resolved with XDP_KERNEL_PINNED=no (verified through the signed InRelease only; pin its sha256 in deploy/tests/xdp/kernels.conf)"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xdp-vm-${{ matrix.kernel }}-${{ matrix.arch }}
          path: |
            target/xdp-vm/*.log
            target/xdp-kernels/*/kernel.env
            target/xdp/plat-xdp-ebpf.sha256
          if-no-files-found: ignore
          retention-days: 14
