# NIST 800-53: SI-7 (Software Integrity), SR-3 (Supply Chain Controls), CM-2 (pinned toolchain).
# Every third-party action is pinned to a full commit SHA (tag in trailing comment).
# The Rust toolchain comes from rust-toolchain.toml (rustup on the runner reads it).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt + clippy (host and aarch64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install AWS-LC FIPS build deps (CMake, Go, clang, aarch64 cross gcc)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake golang-go clang gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross
      - run: make fmt
      - run: make clippy
      - name: make check-linux (aarch64, TLS on)
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: make check-linux
      - name: make check-notls (TLS feature off)
        run: make check-notls

  test:
    name: test (native Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install AWS-LC FIPS build deps (CMake, Go, clang)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake golang-go clang shellcheck
      - run: make test
      - name: Deploy script test (stubbed, real check-config output)
        run: make test-deploy

  security:
    name: supply chain (cargo-audit, cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - run: make security
