[workspace]
resolver = "3"
members = [
    "crates/plat-common",
    "crates/plat-packet",
    "crates/plat-xlat",
    "crates/plat-nat64",
    "crates/plat-audit",
    "crates/plat-io",
    "crates/plat-cluster",
    "crates/plat-tls",
    "crates/plat-xdp-core",
    "services/platd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["usg-plat Contributors"]
license = "Apache-2.0"
rust-version = "1.88"
# Internal crates are never published to crates.io (cargo-deny allow-wildcard-paths).
publish = false

[workspace.dependencies]
plat-common = { path = "crates/plat-common", version = "0.1.0" }
plat-packet = { path = "crates/plat-packet", version = "0.1.0" }
plat-xlat = { path = "crates/plat-xlat", version = "0.1.0" }
plat-nat64 = { path = "crates/plat-nat64", version = "0.1.0" }
# Default features off here: data-plane crates get plat-audit without TLS;
# platd enables `plat-audit/tls` through its own `tls` feature.
plat-audit = { path = "crates/plat-audit", version = "0.1.0", default-features = false }
plat-io = { path = "crates/plat-io", version = "0.1.0" }
plat-cluster = { path = "crates/plat-cluster", version = "0.1.0" }
plat-tls = { path = "crates/plat-tls", version = "0.1.0" }
plat-xdp-core = { path = "crates/plat-xdp-core", version = "0.1.0" }

ahash = "0.8"
clap = { version = "4", features = ["derive"] }
core_affinity = "0.8"
criterion = { version = "0.8", default-features = false }
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
hex = "0.4"
libc = "0.2"
parking_lot = "0.12"
proptest = "1"
# Peer credentials, poll(2), process groups (cluster runtime; safe wrappers).
rustix = { version = "1.1", default-features = false, features = ["std", "event", "net", "process"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
signal-hook = "0.4"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TLS / FIPS boundary (plat-tls only; never a data-plane dependency).
# NIST 800-53: SC-13 - AWS-LC FIPS module via aws-lc-rs; TLS 1.3 only (no
# `tls12` feature). Exact rustls pin: the FIPS policy is checked against it.
rustls = { version = "=0.23.46", default-features = false, features = ["fips", "std", "logging"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
aws-lc-rs = { version = "1.19", default-features = false, features = ["fips", "alloc"] }
zeroize = "1.9"
x509-cert = "0.2.5"
der = { version = "0.7", features = ["alloc", "oid"] }
# RFC 6960 OCSP DER types (no builder: requests and checks use aws-lc-rs).
x509-ocsp = { version = "0.2.1", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }

# XDP fast path (POAM-016 Phase 1). Exact pins: Aya releases churn and the
# 0.15/0.16 crates ship without changelogs, so every upgrade is an explicit
# change that reruns the differential levels 1-3. Transitive pins (aya-obj
# 0.6.0, aya-ebpf-macros/-bindings 0.2.0, aya-ebpf-cty 0.3.0) are held by
# Cargo.lock once a crate uses these.
# NIST 800-53: CM-2, SA-15, SR-3.
aya = { version = "=0.16.0", default-features = false }
aya-ebpf = "=0.2.1"
aya-build = "=0.2.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "allow"

[profile.release]
# NIST 800-53: SI-7 - reproducible, hardened release build.
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
overflow-checks = false

# Packaged binary (`make deb`, `make rpm`): the release build without debug
# info. Symbols stay, so panic backtraces still name functions.
[profile.dist]
inherits = "release"
debug = 0
strip = "debuginfo"

[profile.bench]
inherits = "release"
