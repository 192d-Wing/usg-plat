# Documentation site (https://zensical.org). Build with `make docs`,
# preview with `make docs-serve`. Pages under docs/ that mirror a root file
# (ARCHITECTURE.md, CHANGELOG.md, README.md) include it with pymdownx.snippets
# so the repository copy stays the single source.
[project]
site_name = "usg-plat"
site_description = "Pure-Rust 464XLAT PLAT / stateful NAT64 with SIEM attribution logging, built for NIST SP 800-53 Rev 5"
site_url = "https://192d-wing.github.io/usg-plat/"
repo_url = "https://github.com/192d-Wing/usg-plat"
repo_name = "192d-Wing/usg-plat"
edit_uri = "edit/main/docs/"
copyright = "Licensed under Apache-2.0"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Architecture" = "architecture.md" },
  { "Performance" = "performance.md" },
  { "Compliance" = [
    "compliance/index.md",
    { "NIST 800-53 mapping" = "compliance/NIST_800-53_MAPPING.md" },
    { "RFC compliance" = "compliance/RFC_COMPLIANCE.md" },
    { "SIEM logging" = "compliance/SIEM_LOGGING.md" },
    { "POA&M" = "compliance/POAM.md" },
    { "Linux verification" = "compliance/LINUX_VERIFICATION.md" },
  ] },
  { "Development" = "development.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/network"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/192d-Wing/usg-plat"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
