# usg-plat example configuration.
# NIST 800-53: CM-2 (Baseline Configuration), CM-6 (Configuration Settings).
# Addresses below are documentation ranges (RFC 3849 / RFC 5737); replace them.

[node]
id = 0
name = "plat-01"

[cluster]
# Nodes sharing nat64.pool. Each node owns a disjoint contiguous slice of the
# pool and announces it upstream; see ARCHITECTURE.md "Cluster scale-out".
node_count = 1
# High availability (off unless [cluster.ha] is present with enabled = true;
# see ARCHITECTURE.md). HA needs partition = "slices", the full member list on
# every node, and a witness for automatic failover in two-node clusters.
# partition = "slices"          # "contiguous" (default) | "slices"
# slice_prefix_len = 28         # 16..=32, >= every pool prefix; <= 4096 slices
#
# [[cluster.members]]           # ids 0..n, unique names/identities/addresses
# id = 0
# name = "plat-01"              # must equal that node's node.name
# peer_addr = "198.51.100.11:7946"
# identity = "dns:plat-01.cluster.example"   # typed, exact match
# weight = 1                    # 1..=100
#
# [cluster.ha]
# enabled = true
# listen = "198.51.100.11:7946"  # no wildcard unless allow_wildcard = true
# witness = { addr = "198.51.100.20:7946", identity = "dns:witness.cluster.example" }
# lease_ms = 3000               # 1000..=30000; heartbeat_ms <= lease_ms / 4
# heartbeat_ms = 500
# tcp_adopt_secs = 300          # TCP pickup window after takeover, 0..=3600
# takeover_quarantine_secs = 600
# failback_delay_secs = 60      # 0 = manual failback
# state_dir = "/var/lib/plat/cluster"
# [cluster.ha.hooks]
# announce = "/usr/libexec/plat/frr-announce.sh"
# withdraw = "/usr/libexec/plat/frr-withdraw.sh"
# [cluster.ha.tls]
# cert_file = "/etc/plat/tls/peer.pem"
# key_file = "/etc/plat/tls/peer.key"
# ca_file = "/etc/plat/tls/cluster-ca.pem"
#
# [cluster.steering]
# mode = "drop"                 # "count" | "drop"; default drop with HA, count without

[translation]
# RFC 6052 prefix. This example uses a /96 inside the RFC 8215 local-use
# prefix; the Well-Known Prefix 64:ff9b::/96 (RFC 6052 §2.1) is the usual
# choice. Either way non-global IPv4 destinations are denied by default
# (see allow_non_global_destinations).
nat64_prefix = "64:ff9b:1::/96"
client_prefixes = ["2001:db8:100::/40"]
ipv6_mtu = 1500
ipv4_mtu = 1500
# RFC 7915 §4: DF=0 IPv4 packets larger than this (after translation) are
# fragmented with IPv6 Fragment Headers.
lowest_ipv6_mtu = 1280
# Locally generated Packet Too Big / Fragmentation Needed, per worker per
# second (0 disables; otherwise >= 4, a quarter is reserved for PMTU errors).
icmp_errors_per_sec = 100
copy_tos = true
# RFC 6052 §3.1 deviation switch (WKP only): translate ICMPv4 errors from
# non-global router addresses. Keep false unless documented in the SSP.
wkp_non_global_icmp_errors = false
# SC-7: subscribers may not reach non-global IPv4 space (RFC 1918,
# 100.64/10, 198.18/15, documentation ranges, ...) under any prefix. Set
# true only for a network-specific prefix that must reach such space, and
# record it in the SSP. Ignored (always denied) under the Well-Known Prefix.
# While false, inbound data from non-global IPv4 sources is refused as well
# (ICMP errors from such routers are still translated). The pool below is
# exempt, so subscribers hairpin even with this non-global example pool; the
# Well-Known Prefix requires a global pool.
allow_non_global_destinations = false
# Locally generated ICMP errors (all share icmp_errors_per_sec). Never sent
# about ICMP errors, non-first fragments or multicast/unspecified sources.
send_time_exceeded = true
send_unreachable = true
# RFC 6146 §3.5.2.2 SHOULD, off by default (documented deviation): would
# answer IPv4 scans of the pool with Host Unreachable / Admin Prohibited.
send_inbound_unreachable = false
send_param_problem = true
# Off by default: source-routed IPv4 is dropped silently.
send_source_route_failed = false
# Source of locally generated ICMPv6 errors (RFC 4443 §2.2). Unset: the
# synthesized destination of the offending packet. Must lie outside the
# client prefixes and the NAT64 prefix.
# icmp_source_v6 = "2001:db8:ffff::1"
# Cross-node hairpinning (RFC 6146 §3.8 across cluster nodes). Off by
# default: a wire IPv4 packet sourced from any nat64.pool address is spoofed
# and dropped (src_not_allowed). On: pool sources are accepted only via the
# cluster-internal interfaces below; plat-tun-setup.sh drops them on every
# other interface and platd refuses to start without that guard (POAM-024).
cross_node_hairpin = false
# cluster_interfaces = ["eth1"]

[translation.fragments]
# Per worker, preallocated at start (SC-5). Defaults use about 1 MiB per
# worker; `check-config` rejects more than 64 MiB per worker.
max_entries = 4096
# RFC 6146 FRAGMENT_MIN is 2 s; must stay below the UDP/ICMP timeouts.
timeout_ms = 2000
max_fragments_per_datagram = 64
# Non-first fragments held until their first fragment arrives (0 = off).
max_buffered_fragments = 64
buffer_slot_bytes = 1536
# Concurrent reassemblies for fragmented ICMP and zero-checksum UDP.
reassembly_slots = 4
max_reassembly_bytes = 65535
# "reassemble" (RFC 7915 §4.5) or "drop".
udp_zero_checksum = "reassemble"

[nat64]
pool = ["192.0.2.0/24"]
port_min = 1024
port_max = 65535
# Port blocks (RFC 7422): one allocate and one release record per block.
# This /24 holds 126 blocks per address = 32 256 one-block subscribers.
# If the pool is tight, smaller uniform blocks with the same maximum
# (port_block_size x max_blocks_per_subscriber = 2048) serve more light
# subscribers: 256 x 8 gives 64 512 (8 bits of in-block port randomness),
# 128 x 16 gives 129 024 (7 bits), against 9 bits at 512. Fewer bits make
# off-path spoofing (DNS poisoning, TCP RST injection) easier, so add pool
# addresses first. Heavy subscribers write up to 4x the block records at
# 128 x 16: re-size audit.queue_capacity and the log volume (max_bytes,
# min_free_bytes) to match (AU-4). With HA scale
# cluster.ha.reserve_ahead_blocks by the same factor. All cluster members
# must change together (config digest). `platd check-config` prints the
# numbers; see docs/performance.md "Port-block sizing".
port_block_size = 512
max_blocks_per_subscriber = 4
subscriber_prefix_len = 64
paired_pooling = true
filtering = "address_dependent"
max_sessions = 4000000
max_sessions_per_subscriber = 4000
max_subscribers = 1000000
# At most max_subscribers_per_aggregate subscribers inside one
# aggregate_prefix_len prefix (SC-5): a client holding a /48 cannot fill the
# subscriber table. aggregate_prefix_len is 32..=subscriber_prefix_len (equal
# turns the limit off); a /56 holds exactly 256 /64 subscribers.
aggregate_prefix_len = 56
max_subscribers_per_aggregate = 256
# Lock shards per table; the IPv4 BIB table uses 16x this (at most 65536) so
# the sweeper walks each shard in short lock holds.
table_shards = 1024
# Released port blocks are held back this long before reuse (RFC 6888
# REQ-8; 120..=3600).
block_cooldown_secs = 120
# TCP simultaneous open (RFC 6146 §3.5.2.2): an unsolicited inbound SYN to a
# bound port that address(-port)-dependent filtering refuses is held (never
# forwarded, never opens the filter, never keeps the BIB alive) for
# held_syn_secs (TCP_INCOMING_SYN, 6..=60). A SYN from the subscriber to the
# same remote in that window opens the session ESTABLISHED. SYNs to unbound
# ports stay a silent drop. Bounded by max_held_syns (node-wide, 0 disables)
# and max_held_syns_per_bib (1..=8, one per remote address); check-config prints the worst-case
# memory (SC-5). No effect with filtering = "endpoint_independent".
tcp_simultaneous_open = true
max_held_syns = 16384
max_held_syns_per_bib = 4
held_syn_secs = 6
# ICMPv4 Port Unreachable for a held SYN that expires unmatched (RFC 6146
# §3.5.2.2). Off by default (documented deviation, like
# translation.send_inbound_unreachable); rate-limited by
# translation.icmp_errors_per_sec when on. Warning: when on, the node sends
# a delayed ICMP to the claimed source of any spoofable SYN it held, i.e. it
# becomes a delayed reflector (SEC-002), bounded by the held-SYN caps.
held_syn_unreachable = false

[timeouts]
udp_secs = 300
tcp_established_secs = 7440
tcp_transitory_secs = 240
icmp_secs = 60

[dataplane]
interface = "plat0"
workers = 0
pin_cpus = true
sweep_interval_ms = 1000

[audit]
# port_block: one record per block allocate/release (low volume, full attribution).
# session: also one record per BIB create/delete.
mode = "port_block"
queue_capacity = 1048576
# refuse_new_bindings: never create an unattributable mapping (AU-5).
on_overflow = "refuse_new_bindings"
batch_max = 4096
flush_interval_ms = 100
summary_interval_secs = 60

[audit.file]
path = "/var/log/plat/nat64-audit.jsonl"
max_bytes = 1073741824
# Rotated files kept (oldest deleted beyond this); 0 keeps all. Size the
# volume for max_files x max_bytes, and archive to long-term storage before
# deletion if retention (AU-11) requires it. While the file cannot be
# written, new bindings are refused under refuse_new_bindings (AU-5).
# Retention only deletes files that hold at least one checkpoint, only on a
# size rotation, and writes an audit_retention_prune record first (AU-9).
max_files = 0
# AU-5(1): when the log volume has less free space than this, write an
# audit_storage_threshold record, report /healthz 503 and refuse new
# bindings (existing ones keep being logged). Must be >= 1048576; 0 is
# refused (the warning cannot be disabled). When omitted it defaults to
# max(2 x max_bytes, 1 GiB). Keep it above max_bytes plus a few minutes of
# peak record volume.
min_free_bytes = 2147483648

[[audit.syslog]]
address = "198.51.100.10:514"
transport = "udp"
format = "json"
app_name = "platd"

# RFC 5425 syslog over TLS 1.3 (SC-8, AU-9(2)); octet-counted framing.
# The collector certificate must chain to ca_file (system roots are never
# used) and carry server_name in its SAN. cert_file/key_file (both or
# neither) authenticate this node to the collector. Key files must be owned
# by the service user (mode 0600/0400/0640/0440) or by root with the service
# group (0640/0440).
# [[audit.syslog]]
# address = "192.0.2.10:6514"
# transport = "tls"
# format = "json"
# [audit.syslog.tls]
# server_name = "siem.example.net"
# ca_file = "/etc/plat/tls/siem-ca.pem"
# cert_file = "/etc/plat/tls/platd-client.pem"
# key_file = "/etc/plat/tls/platd-client.key"

[management]
# Without [management.tls] the listener is plaintext and must be loopback.
listen = "127.0.0.1:9464"
# With [management.tls] the (single) listener is mutual TLS only and may use
# any address (AC-17, IA-3). Clients must present a certificate chaining to
# client_ca_file that exactly matches a typed allowed_clients entry (no
# wildcards): "cn:<subject CN>", "dns:<DNS SAN>", "uri:<URI SAN>" or
# "sha256:<64 hex digits, SHA-256 of the certificate DER>". Untyped entries
# are a configuration error.
# max_connections_per_ip (1..=64, capped at max_connections) limits
# concurrent connections from one source address; a client must also send its ClientHello within
# 2 s of connecting (SC-5).
# [management.tls]
# cert_file = "/etc/plat/tls/mgmt.pem"
# key_file = "/etc/plat/tls/mgmt.key"
# client_ca_file = "/etc/plat/tls/mgmt-clients-ca.pem"
# allowed_clients = ["dns:prometheus-01.ops.example.net", "uri:spiffe://ops/prom"]
# max_connections = 4
# max_connections_per_ip = 2
# handshake_timeout_ms = 5000

[tls]
# SC-13: refuse to start unless the AWS-LC FIPS module is active. Setting
# false is an operator override recorded in service_start (plat.fips=false).
require_fips = true
# Offer hybrid X25519MLKEM768 first, then P-256 and P-384.
pq_hybrid = true

[tls.revocation]
# Every non-root certificate of management client chains and syslog
# collector chains: OCSP first, CRL fallback (IA-5(2)). hard_fail rejects
# when no conclusive status is available; soft_fail accepts only when no
# status could be obtained at all (stale data always rejects); off disables.
mode = "hard_fail"
clock_skew_secs = 300
# Whole-chain time budget per handshake; management.tls.handshake_timeout_ms
# must be at least budget_ms + 1000.
budget_ms = 4000
# Optional on-disk CRL cache (0700, owned by the service user); CRLs are
# re-verified when loaded. The shipped systemd unit creates this path
# (StateDirectory=plat/revocation). With it, the highest cRLNumber seen per
# issuer is also persisted (rollback protection across restarts).
# cache_dir = "/var/lib/plat/revocation"

[tls.revocation.ocsp]
enabled = true
# Leaf only; intermediates always use their AIA responder.
# responder_url = "http://192.0.2.20/ocsp"
use_aia = true
method = "post"
cert_id_hash = "sha256"
nonce = true
require_nonce = false
timeout_ms = 2000
max_age_secs = 3600
cache_entries = 1024

[tls.revocation.crl]
enabled = true
use_cdp = true
urls = []
files = []
timeout_ms = 5000
max_bytes = 10485760
cache_bytes = 67108864
max_crls = 64
refresh_margin_secs = 3600
